<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light" />
    <title>ページが見つかりません - yurumeet</title>
    <link rel="icon" href="/assets/yurumeet-logo.png" />
    <style>
      :root {
        --bg: #fafaff;
        --fg: #14141a;
        --fg-muted: #3a3a44;
        --accent: #ff3b3b;
        --accent-text: #e01f1f;
        --border: #e4e4ef;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(
            circle at 85% 10%,
            rgb(255 59 59 / 7%),
            transparent 40%
          ),
          var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Hiragino Kaku Gothic ProN",
          "Yu Gothic UI",
          sans-serif;
        text-align: center;
      }
      .code {
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
        font-size: 0.85rem;
        letter-spacing: 0.2em;
        color: var(--accent-text);
        text-transform: uppercase;
      }
      h1 {
        margin: 0.9rem 0 0.8rem;
        font-size: clamp(2.2rem, 6vw, 3.4rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      p {
        max-width: 30rem;
        margin: 0 auto;
        color: var(--fg-muted);
        font-size: 1rem;
        line-height: 1.8;
      }
      p.en {
        margin-top: 0.4rem;
        font-size: 0.85rem;
      }
      nav {
        margin-top: 2rem;
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      a {
        display: inline-block;
        padding: 0.65rem 1.4rem;
        border-radius: 0.5rem;
        font-size: 0.92rem;
        font-weight: 600;
        text-decoration: none;
        color: var(--fg);
        border: 1px solid var(--border);
      }
      a:hover {
        border-color: var(--fg-muted);
      }
      a.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      a.primary:hover {
        filter: brightness(1.08);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 · not found</p>
      <h1>ページが見つかりません</h1>
      <p>お探しのページは移動したか、存在しません。</p>
      <p class="en">
        The page you are looking for has moved or does not exist.
      </p>
      <nav>
        <a class="primary" href="/">yurumeet トップへ</a>
      </nav>
    </main>
  </body>
</html>
